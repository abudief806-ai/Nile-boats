<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة مراسي البواخر النيلية</title>
<style>
:root{--bg:#0a1424;--card:#12233d;--line:#27406a;--txt:#eaf2ff;--mut:#8fa6c8;--r:#ff4d4d;--b:#27b4ff;--y:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
h1{font-size:1.15rem;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;font-size:.8rem;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px}
.map{position:relative;max-width:1100px;margin:0 auto}
.map img{display:block;width:100%;height:auto}
.pin{position:absolute;width:22px;height:22px;margin:-11px -11px 0 0;border-radius:50%;border:3px solid #fff;cursor:pointer;padding:0;box-shadow:0 0 0 4px rgba(0,0,0,.35)}
.pin:focus-visible{outline:3px solid #fff;outline-offset:3px}
.r{background:var(--r)}.b{background:var(--b)}.y{background:var(--y)}
.sheet{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:2px solid var(--line);padding:16px;transform:translateY(110%);transition:transform .2s;z-index:5}
.sheet.open{transform:none}
.sheet h2{margin:0 0 2px;font-size:1.05rem}
.sheet p{margin:0 0 12px;color:var(--mut);font-size:.85rem}
.acts{display:flex;gap:8px}
.btn{flex:1;text-align:center;padding:12px 8px;border-radius:10px;font-weight:700;text-decoration:none;font-size:.9rem;border:0;cursor:pointer}
.maps{background:var(--b);color:#04213a}.call{background:#2ecc71;color:#05290f}
.off{background:#2a3a55;color:var(--mut);pointer-events:none}
.close{position:absolute;top:8px;left:10px;background:none;border:0;color:var(--mut);font-size:1.4rem;cursor:pointer}
section{padding:6px 16px 90px;max-width:1100px;margin:0 auto}
h3{margin:18px 0 8px;font-size:1rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;border-right:5px solid}
.item.r{border-right-color:var(--r)}.item.b{border-right-color:var(--b)}.item.y{border-right-color:var(--y)}
.item b{display:block}.item small{color:var(--mut);display:block;margin-bottom:10px}
</style>
</head>
<body>
